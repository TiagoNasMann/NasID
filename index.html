<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1b3468" />
    <title>gov.br 2081</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/app.js" defer></script>
  </head>
  <body>
    <main class="mobile-app" aria-label="Aplicativo móvel">
      <header class="app-header">
        <button class="logo-button" data-route="home" aria-label="Ir para início"><img src="assets/logo.avif" alt="gov.br" /></button>
        <button id="header-action" class="icon-button" data-route="data" aria-label="Meus dados"></button>
      </header>
      <div id="screen" tabindex="-1"></div>
      <nav id="navigation" class="bottom-nav" aria-label="Navegação principal"></nav>
      <div id="toast" role="status" aria-live="polite" hidden></div>
    </main>

    <dialog id="photo-dialog" aria-labelledby="photo-title">
      <form method="dialog" class="dialog-header"><h2 id="photo-title">Alterar foto</h2><button class="icon-button" aria-label="Fechar">×</button></form>
      <p>Escolha a foto e ajuste o enquadramento.</p>
      <label class="file-picker">Selecionar imagem<input id="photo-file" type="file" accept="image/jpeg,image/png,image/webp" /></label>
      <div class="crop-preview"><img id="crop-image" src="assets/portrait.svg" alt="Prévia da foto" /></div>
      <label class="slider-label">Zoom<input id="crop-zoom" type="range" min="1" max="3" step="0.01" value="1" /></label>
      <label class="slider-label">Horizontal<input id="crop-x" type="range" min="-1" max="1" step="0.01" value="0" /></label>
      <label class="slider-label">Vertical<input id="crop-y" type="range" min="-1" max="1" step="0.01" value="0" /></label>
      <p id="photo-error" class="error" role="alert"></p>
      <button id="save-photo" class="primary-button" disabled>Salvar foto</button>
    </dialog>

    <dialog id="wallet-dialog" aria-labelledby="wallet-title">
      <form method="dialog" class="dialog-header"><h2 id="wallet-title">Editar dados do cartão</h2><button class="icon-button" aria-label="Fechar">×</button></form>
      <form id="wallet-form" class="wallet-form">
        <label>Nome<input id="wallet-name" required maxlength="80" autocomplete="off" /></label>
        <label>CPF<input id="wallet-number" required maxlength="14" inputmode="numeric" autocomplete="off" /></label>
        <p>Os dados desta capa ficam salvos somente neste navegador.</p>
        <button class="primary-button" type="submit">Salvar dados</button>
      </form>
    </dialog>

    <dialog id="info-dialog" aria-labelledby="info-title">
      <form method="dialog" class="dialog-header"><h2 id="info-title"></h2><button class="icon-button" aria-label="Fechar">×</button></form>
      <p id="info-content"></p>
      <form method="dialog"><button class="primary-button">Entendi</button></form>
    </dialog>
  </body>
</html>
